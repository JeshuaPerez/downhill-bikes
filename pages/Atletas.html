<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Atletas de downhill patrocinados por Specialized, Commencal, Canyon, Giant y Pivot.">
<link rel="icon" type="image/png" href="../images/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="../images/favicon/favicon.svg" />
<link rel="shortcut icon" href="../images/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Downhill Bikes" />
<link rel="manifest" href="../images/favicon/site.webmanifest" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/atletas.css">
<title>Atletas | Downhill Bikes</title>
</head>

<body>

<header class="header">
    <h1>Atletas Patrocinados</h1>
    <p>Rendimiento, velocidad y precisión en cada descenso</p>
</header>

<section class="atletas-grid">

    <article class="atleta-card">
        <video muted loop playsinline preload="none" poster="../images/loic-bruni.jpg" aria-label="Video de Loïc Bruni">
            <source src="../videos/loic-bruni.mp4" type="video/mp4">
        </video>
        <h2>Loïc Bruni</h2>
        <p>Patrocinado por: Specialized</p>
    </article>

    <article class="atleta-card">
        <video muted loop playsinline preload="none" poster="../images/amaury-pierron.jpg" aria-label="Video de Amaury Pierron">
            <source src="../videos/amaury-pierron.mp4" type="video/mp4">
        </video>
        <h2>Amaury Pierron</h2>
        <p>Patrocinado por: Commencal</p>
    </article>

    <article class="atleta-card">
        <video muted loop playsinline preload="none" poster="../images/fabio-wibmer.jpg" aria-label="Video de Fabio Wibmer">
            <source src="../videos/fabio-wibmer.mp4" type="video/mp4">
        </video>
        <h2>Fabio Wibmer</h2>
        <p>Patrocinado por: Canyon</p>
    </article>

    <article class="atleta-card">
        <video muted loop playsinline preload="none" poster="../images/luke-meier.jpg" aria-label="Video de Luke Meier">
            <source src="../videos/luke-meier.mp4" type="video/mp4">
        </video>
        <h2>Luke Meier</h2>
        <p>Patrocinado por: Giant</p>
    </article>

    <article class="atleta-card">
        <video muted loop playsinline preload="none" poster="../images/jenna-hastings.jpg" aria-label="Video de Jenna Hastings">
            <source src="../videos/jenna-hastings.mp4" type="video/mp4">
        </video>
        <h2>Jenna Hastings</h2>
        <p>Patrocinado por: Pivot</p>
    </article>

</section>

<div class="volver">
    <a href="../index.html">⬅ Volver al inicio</a>
</div>

<script>
// Cada video se carga y reproduce solo cuando está a la vista, para no descargar los 5 a la vez.
const videos = document.querySelectorAll('.atleta-card video');
const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
        if (entry.isIntersecting) {
            entry.target.play().catch(() => {});
        } else {
            entry.target.pause();
        }
    });
}, { threshold: 0.4 });
videos.forEach((video) => observer.observe(video));
</script>

</body>
</html>
